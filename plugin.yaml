name: coach
version: "0.1.0"
description: "Four modes: Consult on demand, Active per-turn review, Review before claiming done, and Decide for forks with Jev."
author: Nous user
kind: standalone

provides_tools:
  - coach_ask
  - coach_decide

provides_hooks:
  - post_llm_call
  - pre_llm_call
  - pre_verify
  - post_tool_call
  - subagent_start
  - subagent_stop
  - on_session_end

config_schema:
  # Models
  coach_model:
    type: dict
    default: null
    description: "Model every mode uses unless it has its own. Until one is chosen the plugin is unconfigured: tools say so and Review stays quiet. Same catalog as the main chat picker."
  active_model:
    type: dict
    default: null
    description: "Override for Active. This mode runs every turn, so a cheap fast model here saves the most."
  review_model:
    type: dict
    default: null
    description: "Override for Review. It gates completion, so this is where the strongest model earns its cost."
  consult_model:
    type: dict
    default: null
    description: "Override for Consult."
  max_reply_tokens:
    type: int
    default: 400
    description: "Hard cap on the coach's answer. Output is the expensive half of a review; this is the main lever."

  # Modes
  active_enabled:
    type: bool
    default: false
    description: "Reviews each completed turn and delivers advice by the delivery policy. Off by default because it is the only mode that spends on every turn."
  active_cadence:
    type: str
    default: tool_turns_only
    choices:
      - tool_turns_only
      - every_turn
      - every_n
    description: "Which turns Active reviews. `tool_turns_only` skips turns where the agent only talked; `every_n` reviews one turn in N."
  active_every_n:
    type: int
    default: 3
    description: "Turns per review when the cadence is `every_n`."
  review_enabled:
    type: bool
    default: true
    description: "Reviews the diff when the agent is about to claim it is done. Fires only on turns that edited files."
  review_authority:
    type: str
    default: hold_once
    choices:
      - hold_once
      - report
    description: "`hold_once` may send the agent back to work one time per request; `report` only attaches findings."
  review_max_holds:
    type: int
    default: 1
    description: "Holds allowed per user request. Above one, the gate turns into an argument."
  decide_enabled:
    type: bool
    default: false
    description: "Exposes `coach_decide` for typed fork resolution. Needs a backend below."
  decide_backend:
    type: str
    default: jev-openrouter
    choices:
      - jev-openrouter
      - jev-direct
      - chat-model
    description: "Where decisions come from. `jev-openrouter` uses your OpenRouter key; `jev-direct` uses a TypeSafe key; `chat-model` works with any chat model but has weaker confidence."
  decide_model:
    type: str
    default: typesafe/jev-1.14
    description: "The decision model. Not a chat model — it returns verdicts, not prose."
  decide_min_confidence:
    type: float
    default: 0.60
    description: "Below this the tool answers `escalate` instead of picking. Raise it for destructive choices."
  decide_max_calls_per_turn:
    type: int
    default: 3
    description: "Stops an agent from outsourcing its judgement one call at a time."
  consult_max_calls_per_turn:
    type: int
    default: 4
    description: "Same cap for consultations."
  decide_typesafe_api_key:
    type: secret
    default: ""
    description: "Only for `jev-direct`. Stored in `.env` as `TYPESAFE_API_KEY`, never in `config.yaml`."

  # Delivery
  delivery_policy:
    type: str
    default: severity
    choices:
      - severity
      - ambient
      - corrective
    description: "`ambient` = card now, model sees it next turn, no extra call. `corrective` = new turn now, agent acts. `severity` = blockers corrective, everything else ambient."
  delivery_max_corrective_per_request:
    type: int
    default: 1
    description: "Per user request. Stops advice from turning into a conversation of its own."
  delivery_show_cards:
    type: bool
    default: true
    description: "Post a card for ambient notes. Off means advice reaches the model but you never see it."
  delivery_note_ttl_turns:
    type: int
    default: 2
    description: "Undelivered notes are dropped after this many turns instead of surfacing stale."

  # Budget
  budget_session_usd:
    type: float
    default: 0.50
    description: "Coach spend per session, computed from real usage, not estimates of calls."
  budget_on_exceed:
    type: str
    default: soft
    choices:
      - warn
      - soft
      - hard
    description: "`warn` keeps going; `soft` stops Active, Review and Decide but leaves explicit consults; `hard` stops everything."

  # Guidance
  guidance_enabled:
    type: bool
    default: true
    description: "Send guidance to the coach. Off ignores both files without deleting them."

  # Advanced
  worker_timeout_s:
    type: int
    default: 45
    description: "Deadline for one coach call."
  ledger_max_tool_result_chars:
    type: int
    default: 400
    description: "Per-result truncation in the ledger."
  ledger_max_recent_turns:
    type: int
    default: 3
    description: "Turns kept as tool cards."
  ledger_note_max_chars:
    type: int
    default: 1000
    description: "Size of the coach's running intent note."
  ledger_max_tokens:
    type: int
    default: 3500
    description: "Ceiling for the assembled ledger."
  skip_same_model:
    type: bool
    default: true
    description: "Refuse a coach model identical to the primary."
  allow_in_subagents:
    type: bool
    default: false
    description: "Allow `coach_ask` inside subagent and delegate sessions. Off by default so a child session cannot spend the coach budget or loop on its own advice."
  debug_log_decisions:
    type: bool
    default: false
    description: "Log prompt sizes, parse results and delivery routing."
