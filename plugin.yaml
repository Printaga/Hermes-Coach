name: coach
version: "1.0.1"
description: "Four modes: Consult on demand, Active per-turn review, Review before claiming done, and Decide for forks with Jev."
author: Printaga Publishing LLC
kind: standalone
homepage: https://pluginsforhermes.com/
requires_hermes: ">=0.22.7"

requires_env:
  - name: OPENROUTER_API_KEY
    description: "Optional. Only used by the Decide jev-openrouter backend; Decide is off by default."
    secret: true
  - name: TYPESAFE_API_KEY
    description: "Optional. Only used by the Decide jev-direct backend; Decide is off by default."
    secret: true

provides_tools:
  - coach_ask
  - coach_decide

provides_hooks:
  - post_llm_call
  - pre_llm_call
  - pre_verify
  - post_tool_call
  - subagent_start
  - subagent_stop
  - on_session_end
