# Minimal hygiene battery (see .audit report's import-hygiene finding):
# pyflakes error rules (F) + import order (I). Extended rulesets come with
# the structural refactors that own their own rule coverage.
target-version = "py311"
line-length = 100
[lint]
select = ["F", "I"]
[lint.isort]
known-first-party = ["coach", "dashboard", "desktop", "scripts", "tests"]
